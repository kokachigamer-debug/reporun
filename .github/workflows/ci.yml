name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reporun/package-lock.json
      - name: Install deps
        working-directory: reporun
        run: npm ci || npm install
      - name: Lint
        working-directory: reporun
        run: npm run lint
      - name: Unit tests
        working-directory: reporun
        run: npm run test
      - name: Build (vite)
        working-directory: reporun
        run: npm run build

  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libglib2.0-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: reporun/src-tauri
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true
      - name: cargo fmt check
        working-directory: reporun/src-tauri
        run: cargo fmt --all -- --check
      - name: cargo clippy
        working-directory: reporun/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: reporun/src-tauri
        run: cargo test --all
      - name: cargo audit
        working-directory: reporun/src-tauri
        run: cargo audit --deny warnings
      - name: npm audit (frontend)
        working-directory: reporun
        run: npm audit --audit-level=high || true
      - name: Build check
        working-directory: reporun/src-tauri
        run: cargo build --release
